[package]
name = "herald-cli"
version = "0.1.0"
edition = "2024"
description = "CLI d'analyse de code Herald (sans IA, déterministe) — moteur open source."
license = "AGPL-3.0-only"

[[bin]]
name = "herald"
path = "src/main.rs"

[dependencies]
herald-engine = { path = "../herald-engine" }
walkdir = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
